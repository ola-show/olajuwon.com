<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Our website is coming soon." />
  <title>Coming Soon</title>

  <style>
    :root {
      --bg-1: #08111f;
      --bg-2: #0d1b2d;
      --bg-3: #12344d;
      --text: #f8fbff;
      --muted: rgba(239, 247, 255, 0.72);
      --line: rgba(255, 255, 255, 0.16);
      --glass: rgba(255, 255, 255, 0.08);
      --glass-strong: rgba(255, 255, 255, 0.12);
      --accent-1: #76ddff;
      --accent-2: #8ff4d6;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(84, 190, 255, 0.18), transparent 30%),
        radial-gradient(circle at 82% 76%, rgba(84, 255, 197, 0.14), transparent 32%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2) 52%, var(--bg-3));
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 48px);
      position: relative;
      isolation: isolate;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: clamp(240px, 35vw, 520px);
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(10px);
      opacity: 0.5;
      z-index: -2;
      animation: float 10s ease-in-out infinite alternate;
    }

    body::before {
      top: -12%;
      left: -8%;
      background: radial-gradient(circle, rgba(77, 190, 255, 0.32), transparent 65%);
    }

    body::after {
      right: -10%;
      bottom: -16%;
      background: radial-gradient(circle, rgba(85, 255, 194, 0.24), transparent 65%);
      animation-delay: -3s;
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.2;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }

    .glass-card {
      width: min(100%, 960px);
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: clamp(26px, 4vw, 42px);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.13), rgba(255,255,255,0.055));
      box-shadow: var(--shadow);
      backdrop-filter: blur(26px) saturate(145%);
      -webkit-backdrop-filter: blur(26px) saturate(145%);
      padding: clamp(34px, 7vw, 84px) clamp(24px, 7vw, 76px);
      text-align: center;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.18), transparent 28%),
        linear-gradient(315deg, rgba(255,255,255,0.05), transparent 35%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(4px);
    }

    .orb.one {
      width: 150px;
      height: 150px;
      top: -65px;
      right: -45px;
      background: rgba(119, 220, 255, 0.15);
    }

    .orb.two {
      width: 120px;
      height: 120px;
      bottom: -55px;
      left: -35px;
      background: rgba(143, 244, 214, 0.12);
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: clamp(22px, 4vw, 34px);
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 999px;
      background: rgba(255,255,255,0.07);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.82);
      font-size: clamp(11px, 1.6vw, 13px);
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 18px rgba(143, 244, 214, 0.8);
    }

    h1 {
      max-width: 820px;
      margin: 0 auto;
      font-size: clamp(3.6rem, 10vw, 7.8rem);
      line-height: 0.88;
      letter-spacing: -0.065em;
      font-weight: 800;
      text-wrap: balance;
    }

    .highlight {
      display: inline-block;
      padding-right: 0.06em;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 24px rgba(111, 220, 255, 0.15));
    }

    .divider {
      width: clamp(56px, 8vw, 84px);
      height: 3px;
      margin: clamp(28px, 5vw, 42px) auto;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
      box-shadow: 0 0 24px rgba(118, 221, 255, 0.24);
    }

    .subtitle {
      width: min(100%, 650px);
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.24rem);
      line-height: 1.75;
      text-wrap: balance;
    }

    footer {
      margin-top: clamp(36px, 6vw, 58px);
      color: rgba(255,255,255,0.46);
      font-size: 0.88rem;
    }

    @keyframes float {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(20px, 24px, 0) scale(1.08);
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }

      .glass-card {
        min-height: min(680px, calc(100svh - 32px));
        display: grid;
        place-items: center;
        border-radius: 28px;
        padding: 38px 22px;
      }

      h1 {
        font-size: clamp(3.25rem, 18vw, 5.2rem);
        letter-spacing: -0.07em;
      }

      .subtitle {
        max-width: 34ch;
        line-height: 1.65;
      }

      footer {
        margin-top: 38px;
      }
    }

    @media (max-width: 380px) {
      .badge {
        padding: 9px 12px;
        letter-spacing: 0.1em;
      }

      .glass-card {
        padding-inline: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before,
      body::after {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div class="noise" aria-hidden="true"></div>

  <main class="glass-card">
    <div class="orb one" aria-hidden="true"></div>
    <div class="orb two" aria-hidden="true"></div>

    <div class="content">
      <div class="badge">
        <span class="dot"></span>
        Something exciting is on the way
      </div>

      <h1>
        Coming <span class="highlight">Soon.</span>
      </h1>

      <div class="divider"></div>

      <p class="subtitle">
        We’re working behind the scenes to create something special.
        Our new website is launching soon.
      </p>

      <footer>
        &copy; <span id="year"></span> www.olajuwon.com All Rights Reserved.
      </footer>
    </div>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
